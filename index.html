<script>
    const urlParams = new URLSearchParams(window.location.search);
    const urlTujuan = urlParams.get('url');

    if (urlTujuan) {
        let hitung = 5;
        const elemenWaktu = document.getElementById('waktu');
        const elemenTombol = document.getElementById('tombolTujuan');
        
        elemenTombol.href = urlTujuan;

        const interval = setInterval(() => {
            hitung--;
            elemenWaktu.innerText = hitung;

            if (hitung <= 0) {
                clearInterval(interval);
                // Sembunyikan teks hitung mundur
                document.querySelector('.countdown-text').style.display = 'none';
                // Munculkan tombol klik secara penuh dan menarik
                elemenTombol.style.display = 'inline-block';
                elemenTombol.innerText = "Lanjutkan ke Situs Utama";
            }
        }, 1000);
    } else {
        document.querySelector('.safelink-container').innerHTML = '<h2>Error: Tautan tidak valid!</h2>';
    }
</script>
